server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path not matching a real
    # static file (e.g. /booking, /staff/dashboard) must fall back to
    # index.html so React can handle the route itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
